name: Rental alert

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"   # every 10 min (UTC), off the busy :00 mark
  workflow_dispatch:                      # manual run from the Actions tab
    inputs:
      send_test:
        description: "Email every offer currently online (as a [TEST])"
        type: boolean
        default: false

# lets the job commit data/seen.json back to the repo
permissions:
  contents: write

concurrency:
  group: rental-alert
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check for new offers
        env:
          SEARCH_URL: ${{ secrets.SEARCH_URL }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          FORCE_EMAIL: ${{ inputs.send_test }}
        run: python watcher.py

      - name: Commit seen offers
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update seen offers [skip ci]"
            git push
          fi
